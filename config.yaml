model:
  input_shape: [128, 128, 3]
  num_classes: 2
  learning_rate: 0.0005

data:
  ela_quality: 90
  target_size: [128, 128]
  test_size: 0.2
  random_state: 42

training:
  epochs: 30
  batch_size: 100
  early_stopping_patience: 2
  monitor_metric: "val_accuracy"
  output_dir: "outputs"

api:
  host: "0.0.0.0"
  port: 8000
  model_path: null
  max_file_size: 10485760  # 10MB
