[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fake-image-detector"
version = "0.1.0"
description = "Image Tampering Detection using ELA and CNN"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Agus Gunawan", email = "agus@example.com"},
    {name = "Holy Lovenia", email = "holy@example.com"},
    {name = "Adrian Hartanto Pramudita", email = "adrian@example.com"},
]
keywords = ["machine-learning", "computer-vision", "image-processing", "deep-learning", "cnn"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "tensorflow>=2.10.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pillow>=8.0.0",
    "scikit-learn>=1.0.0",
    "pydantic>=1.8.0",
    "fastapi>=0.68.0",
    "uvicorn>=0.15.0",
    "click>=8.0.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.5",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0.0",
    "pytest-cov>=2.12.0",
    "black>=21.0.0",
    "isort>=5.9.0",
    "flake8>=3.9.0",
    "mypy>=0.910",
    "pre-commit>=2.15.0",
]

[project.urls]
Homepage = "https://github.com/fujispooo/FakeImageDetector"
Repository = "https://github.com/fujispooo/FakeImageDetector"
Issues = "https://github.com/fujispooo/FakeImageDetector/issues"

[project.scripts]
fake-image-detector = "fake_image_detector.cli.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--cov=src/fake_image_detector --cov-report=term-missing --cov-report=html"
